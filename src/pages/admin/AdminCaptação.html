<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raffros · Máquina de Captação</title>
<style>
:root{--bg:#0a1030;--card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.1);--bd:rgba(255,255,255,.13);--tx:#eaeeff;--mut:#9fabdb;--pk:#FF5C95;--vi:#7c5cff;--bl:#3b82f6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);line-height:1.55;font-size:15px;
background:radial-gradient(1100px 700px at 8% -10%,rgba(60,70,220,.38),transparent),radial-gradient(900px 600px at 100% 8%,rgba(255,92,149,.22),transparent),linear-gradient(160deg,#0a1030,#111858 60%,#1c1065);background-attachment:fixed;min-height:100vh}
a{color:#9db4ff}
.app{display:flex;align-items:flex-start}
aside{width:264px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;border-right:1px solid var(--bd);background:rgba(8,12,40,.6);backdrop-filter:blur(16px);z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--bl),var(--vi),var(--pk));display:grid;place-items:center;font-weight:800}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:11px}
nav a{display:flex;gap:10px;align-items:center;padding:9px 11px;border-radius:11px;color:var(--mut);text-decoration:none;font-size:14px;cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--card);color:var(--tx)}
nav a.on{background:linear-gradient(90deg,rgba(124,92,255,.35),rgba(255,92,149,.25));color:#fff;border:1px solid var(--bd)}
nav .sep{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#6f7bb0;margin:14px 10px 6px}
.topbar{display:none;position:sticky;top:0;z-index:25;padding:10px 14px;background:rgba(8,12,40,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);align-items:center;gap:12px}
main{flex:1;min-width:0;padding:30px 28px 80px;max-width:1140px;margin:0 auto}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:21px;margin:26px 0 10px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 20px;max-width:760px}
.grad{background:linear-gradient(90deg,#7aa2ff,#b28cff,var(--pk));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;backdrop-filter:blur(10px)}
.card.hl{background:linear-gradient(135deg,rgba(59,130,246,.22),rgba(124,92,255,.22),rgba(255,92,149,.2))}
.g2,.g3,.g4{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{font-size:30px;font-weight:800;letter-spacing:-.02em}
.kpi small{font-size:12px;color:var(--mut);font-weight:500;display:block;letter-spacing:0}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);background:rgba(255,255,255,.07);color:var(--mut);margin:0 4px 4px 0;white-space:nowrap}
.tag.ok{color:var(--ok);border-color:rgba(52,211,153,.4)}.tag.warn{color:var(--warn);border-color:rgba(251,191,36,.4)}.tag.bad{color:var(--bad);border-color:rgba(248,113,113,.4)}.tag.pk{color:var(--pk);border-color:rgba(255,92,149,.5)}.tag.bl{color:#8db0ff;border-color:rgba(141,176,255,.4)}
.btn{background:var(--card2);border:1px solid var(--bd);color:var(--tx);padding:7px 13px;border-radius:10px;cursor:pointer;font:inherit;font-size:13.5px}
.btn:hover{border-color:var(--pk)}
.btn.pk{background:linear-gradient(90deg,var(--vi),var(--pk));border:none;font-weight:600}
.btn.sm{padding:4px 10px;font-size:12.5px}
input,select,textarea{background:rgba(5,8,30,.55);border:1px solid var(--bd);color:var(--tx);padding:8px 10px;border-radius:10px;font:inherit;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(255,92,149,.5)}
label.f{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.note{border-left:3px solid var(--warn);background:rgba(251,191,36,.08);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0;font-size:14px}
.note.bad{border-color:var(--bad);background:rgba(248,113,113,.08)}.note.ok{border-color:var(--ok);background:rgba(52,211,153,.07)}.note.pk{border-color:var(--pk);background:rgba(255,92,149,.08)}
.msg{white-space:pre-wrap;background:rgba(5,8,30,.55);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:8px 0}
.why{font-size:13px;color:var(--mut)}.why b{color:#c9d3ff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.scroll{overflow-x:auto}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch;margin:10px 0 18px}
.stage{flex:1 1 120px;min-width:112px;padding:12px 10px;border-radius:14px;background:var(--card);border:1px solid var(--bd);cursor:pointer;text-align:center;position:relative;font-size:13px}
.stage:hover{border-color:var(--pk)}
.stage.on{background:linear-gradient(135deg,rgba(124,92,255,.5),rgba(255,92,149,.4));border-color:transparent}
.stage .n{display:block;font-size:11px;color:var(--mut);margin-bottom:2px}.stage .i{font-size:20px;display:block}
.stage:not(:last-child)::after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--pk);font-size:18px;z-index:2}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.tab{padding:6px 13px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:13.5px;color:var(--mut)}
.tab.on{background:linear-gradient(90deg,var(--vi),var(--pk));color:#fff;border-color:transparent}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--tx);cursor:pointer;font:inherit}
.opt:hover{border-color:var(--pk);background:var(--card2)}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px dashed var(--bd);cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;accent-color:var(--pk);flex:none}
.chk.done span{text-decoration:line-through;color:var(--mut)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--vi),var(--pk));transition:width .3s}
.chat{display:flex;flex-direction:column;gap:7px;margin:8px 0}
.b{max-width:86%;padding:8px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.b.me{align-self:flex-end;background:linear-gradient(135deg,var(--vi),#a24cd6);border-bottom-right-radius:4px}
.b.her{align-self:flex-start;background:rgba(255,255,255,.1);border-bottom-left-radius:4px}
.b.cm{align-self:center;background:rgba(251,191,36,.1);border:1px dashed rgba(251,191,36,.45);font-size:12.5px;color:#f3dca0;max-width:96%}
details{border:1px solid var(--bd);border-radius:12px;padding:10px 14px;background:var(--card);margin:8px 0}
summary{cursor:pointer;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111a55;border:1px solid var(--pk);padding:9px 18px;border-radius:12px;z-index:99;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}
ul.t{margin:6px 0 6px 18px;padding:0}ul.t li{margin:3px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;min-width:26px;text-align:center;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.1);font-size:12px}
.sc{font-size:46px;font-weight:800}
@media(max-width:880px){
 aside{position:fixed;left:-290px;transition:left .25s;width:272px}
 aside.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
 .topbar{display:flex}
 main{padding:18px 14px 70px}
 h1{font-size:25px}
 .stage:not(:last-child)::after{display:none}
}

/* =========================================================
   RAFFROS — DARK NOIR / GREEN ACCENT
   Camada visual: preserva conteúdo, navegação e interações.
   ========================================================= */
:root{
  color-scheme:dark;

  --ok:#B7F36B;
  --warn:#E8C878;
  --bad:#F08080;
  --rf-noir:#080A09;
  --rf-panel:#101411;
  --rf-panel-raised:#151B16;
  --rf-green:#B7F36B;
  --rf-green-soft:rgba(183,243,107,.12);

}

}

  border-radius:17px;
  box-shadow:0 12px 35px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.025);
  backdrop-filter:blur(16px);
  transition:border-color .22s ease,transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s ease;
}
.card:hover{border-color:rgba(183,243,107,.17);box-shadow:0 16px 42px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.035)}
.card.hl{
  background:
    radial-gradient(500px 220px at 0% 0%,rgba(183,243,107,.09),transparent 72%),
    linear-gradient(145deg,#151B15,#101411 78%);
  border-color:rgba(183,243,107,.19);
}
.kpi{color:#F4F7F2;letter-spacing:-.055em}
.kpi small{color:#929C94}
.tag{background:rgba(255,255,255,.035);border-color:rgba(226,239,229,.12);color:#AAB4AA}
.tag.ok,.tag.pk{color:#C7F69A;border-color:rgba(183,243,107,.28);background:rgba(183,243,107,.07)}
.tag.bl{color:#C4D5B6;border-color:rgba(183,243,107,.2)}
.btn{
  color:#E8EEE7;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(226,239,229,.12);
  border-radius:10px;
  transition:background .2s ease,border-color .2s ease,color .2s ease,transform .2s ease,box-shadow .2s ease;
}
.btn:hover{border-color:rgba(183,243,107,.42);background:rgba(183,243,107,.07);transform:translateY(-1px)}
.btn.pk{
  color:#10150D;
  background:linear-gradient(135deg,#D1F79F,#A9E45D 65%,#91D44A);
  border:1px solid rgba(221,255,188,.45);
  box-shadow:0 6px 20px rgba(151,214,82,.16),inset 0 1px 0 rgba(255,255,255,.55);
  font-weight:700;
}

  color:#F0F5EF;
  background:#0B100C;
  border:1px solid rgba(226,239,229,.13);
  border-radius:10px;
  transition:border-color .2s ease,box-shadow .2s ease,background .2s ease;
}
input::placeholder,textarea::placeholder{color:#657166}
input:focus,select:focus,textarea:focus{
  outline:0;
  border-color:rgba(183,243,107,.55);
  box-shadow:0 0 0 3px rgba(183,243,107,.10);
  background:#0D130E;
}
label.f{color:#A0AAA0}
.note{
  border-left:2px solid var(--warn);
  background:rgba(232,200,120,.065);
  border-radius:0 12px 12px 0;
  color:#D9D9C9;
}
.note.ok{border-color:var(--rf-green);background:rgba(183,243,107,.065)}
.note.pk{border-color:var(--rf-green);background:rgba(183,243,107,.065)}
.note.bad{border-color:var(--bad);background:rgba(240,128,128,.065)}
.msg{
  color:#E8EEE7;
  background:#0B100C;
  border:1px solid rgba(226,239,229,.10);
  border-radius:13px;
  line-height:1.65;
}
.why{color:#929C94;line-height:1.65}
.why b{color:#D9E4D7}
table{color:#E7ECE5}
th{color:#8D998E}
th,td{border-bottom-color:rgba(226,239,229,.09)}
.flow{gap:9px}
.stage{
  color:#DDE5DB;
  background:linear-gradient(145deg,rgba(22,28,23,.88),rgba(13,17,14,.92));
  border:1px solid rgba(226,239,229,.10);
  border-radius:14px;
  transition:transform .24s cubic-bezier(.22,1,.36,1),border-color .24s ease,background .24s ease,box-shadow .24s ease;
}
.stage:hover{border-color:rgba(183,243,107,.35);transform:translateY(-2px)}
.stage.on{
  color:#F3F9EF;
  background:linear-gradient(145deg,rgba(183,243,107,.17),rgba(183,243,107,.055));
  border-color:rgba(183,243,107,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 26px rgba(0,0,0,.16);
}
.stage .n{color:#849184;font-weight:650;letter-spacing:.06em}
.stage .i{
  display:grid;place-items:center;
  width:36px;height:36px;
  margin:7px auto 8px;
  border-radius:11px;
  background:rgba(183,243,107,.075);

  color:#A2ADA2;

  transition:all .2s ease;
}
.tab:hover{color:#EAF5E4;border-color:rgba(183,243,107,.3)}

  color:#11160E;
  background:linear-gradient(135deg,#D1F79F,#A9E45D);
  border-color:transparent;
  box-shadow:0 5px 18px rgba(151,214,82,.13);
}

  color:#E5ECE3;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(226,239,229,.10);
  border-radius:12px;
  transition:background .2s ease,border-color .2s ease,transform .2s ease;

.b{border:1px solid rgba(226,239,229,.08);border-radius:14px;line-height:1.55}
.b.me{
  color:#10150D;
  background:linear-gradient(135deg,#C9F39A,#9EDB59);
  border-color:rgba(221,255,188,.25);
  border-bottom-right-radius:5px;
}
.b.her{color:#E6ECE4;background:#171E18;border-bottom-left-radius:5px}
.b.cm{color:#D8D1B3;background:rgba(232,200,120,.07);border:1px dashed rgba(232,200,120,.28)}
details{background:rgba(255,255,255,.025);border-color:rgba(226,239,229,.10);border-radius:13px}
summary{color:#EAF0E8}
.pill{color:#C5E9A0;background:rgba(183,243,107,.10)}

.toast{
  color:#EAF5E4;
  background:rgba(17,23,18,.96);
  border:1px solid rgba(183,243,107,.34);
  box-shadow:0 12px 38px rgba(0,0,0,.35);
  backdrop-filter:blur(16px);
}
#burger{font-size:0;width:40px;height:40px;position:relative}
#burger:before,#burger:after{content:"";position:absolute;left:11px;width:16px;height:1.5px;background:#DDE8D9;border-radius:3px}
#burger:before{top:15px;box-shadow:0 5px 0 #DDE8D9}
#burger:after{top:25px;width:10px}

  aside{background:rgba(9,12,10,.97);border-right-color:rgba(226,239,229,.10)}
  aside.open{box-shadow:0 0 0 100vmax rgba(0,0,0,.68),12px 0 50px rgba(0,0,0,.35)}
  main{padding-top:22px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}
}

</style>
</head>
<body>
<div class="topbar"><button class="btn" id="burger" aria-label="Abrir menu"></button><b>Raffros · Captação</b></div>
<div class="app">
<aside id="side"><div class="brand"><div class="logo">R</div><div><b>Raffros</b><small>Máquina de captação</small></div></div><nav id="nav"></nav></aside>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>

/* ========= HELPERS ========= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const mem={};
const S={get(k,d){try{const v=localStorage.getItem('rf_'+k);return v?JSON.parse(v):(k in mem?mem[k]:d)}catch(e){return k in mem?mem[k]:d}},
 set(k,v){mem[k]=v;try{localStorage.setItem('rf_'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

let REG=[];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),1600)}
function fill(t){const p=S.get('P',{});const m={'[Nome]':p.nome,'[Negócio]':p.neg,'[Bairro]':p.bairro,'[Link]':p.link,'[Seu nome]':p.eu};
 let o=t;for(const k in m){if(m[k])o=o.split(k).join(m[k])}return o}
function cp(i){const t=fill(REG[i]);const done=()=>toast('Mensagem copiada ✓');
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fb(t,done))}else fb(t,done)}
function fb(t,done){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()}
function msg(t){REG.push(t);const i=REG.length-1;return `<div class="msg">${esc(fill(t))}</div><button class="btn sm pk" onclick="cp(${i})">Copiar mensagem</button>`}
function ev(l){const m={r:['ok','Relato 1ª pessoa'],o:['warn','Opinião'],v:['bl','Caso de fornecedor (auto-reportado)'],h:['pk','Hipótese minha'],f:['bad','Não verificado']};return `<span class="tag ${m[l][0]}">${m[l][1]}</span>`}

function funnel(v,d){const c=v[0]*wd(d),r=c*v[1]/100,de=r*v[2]/100,t=de*v[3]/100,p=t*v[4]/100;return [c,r,de,t,p]}

function plano(){
 const rows=[];for(let d=1;d<=30;d++){let foco,tar;

 const sc=SCN;const f=d=>funnel(sc,d);
 return `<h1>Plano de <span class="grad">30 dias</span></h1><p class="sub">Para quem começa sozinho. Tempo diário ≈ 3h30; descanso/revisão leve nos dias 7, 14, 21 e 28.</p>

<tr><td>Conversas</td><td>45 min</td><td>Responder tudo em até 1h</td></tr><tr><td>Follow-ups</td><td>30 min</td><td>Todos os marcos de 24h, 48h e 3 dias</td></tr>
